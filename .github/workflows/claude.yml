# The Claude builder: `@claude` in an issue or PR comment starts one on a
# GitHub Actions runner. Calls the shared workflow in edsaperia/dev-ops — see
# its claude/SETUP.md and CONVENTIONS.md.
name: claude
on:
  issue_comment: { types: [created] }
  pull_request_review_comment: { types: [created] }
  pull_request_review: { types: [submitted] }
  issues: { types: [opened] }
jobs:
  claude:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: edsaperia/dev-ops/.github/workflows/claude-builder.yml@main
    with:
      # Tests run on embedded PGlite, so no database service is needed.
      node-version: '24'
      setup: 'npm ci'
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
